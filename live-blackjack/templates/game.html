<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Live Blackjack</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="topbar">
        <span class="brand">♠ ROYAL BLACKJACK</span>
        <span id="session-info"></span>
    </nav>

    <main class="container">
        <!-- tavolo di gioco -->
        <div class="table">
            <div class="seat">
                <div class="seat-label">BANCO <span id="dealer-value" class="value-pill"></span></div>
                <div id="dealer-hand" class="hand"></div>
                <!-- messaggio vinto/perso/pareggio, sotto al banco -->
                <div id="game-message" class="result-banner"></div>
            </div>

            <div class="seat">
                <div class="seat-label">TU <span id="player-value" class="value-pill"></span></div>
                <div id="player-hand" class="hand"></div>
            </div>

            <div class="actions">
                <button id="new-game-btn" class="btn btn-gold">NUOVA MANO</button>
                <button id="hit-btn" class="btn" disabled>CARTA</button>
                <button id="stand-btn" class="btn" disabled>STAI</button>
            </div>
        </div>

        <!-- colonna destra -->
        <aside class="sidebar">
            <div class="panel">
                <div class="panel-title">Il tuo punteggio</div>
                <div id="my-score" class="big-score">0</div>
                <div class="legend">Vittoria +10 · Pareggio +2 · Perdita −5</div>
                <div id="wl-stats">0 vittorie · 0 pareggi · 0 sconfitte</div>
            </div>

            <div class="panel">
                <div class="panel-title">Classifica <span id="conn-status">connessione…</span></div>
                <table class="board">
                    <thead>
                        <tr><th>Giocatore</th><th>Punti</th><th>V/P/S</th></tr>
                    </thead>
                    <tbody id="leaderboard"></tbody>
                </table>
            </div>
        </aside>
    </main>

    <!-- modale di ingresso, sopra alla UI principale -->
    <div id="join-modal" class="modal-overlay">
        <div class="modal-card">
            <h2>Benvenuto al tavolo</h2>
            <input type="text" id="player-name" placeholder="Il tuo nome" maxlength="20" autocomplete="off">
            <button id="join-btn" class="btn btn-gold">Prendi posto</button>
            <div id="join-error"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/game.js') }}"></script>
</body>
</html>
